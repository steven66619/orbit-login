# orbit-login configuration
# Bedrock-aware display manager

[Daemon]
Verbose = 0
VTNumber = 7
SessionTimeout = 30
GreeterUser = root

[X11]
XorgPath = /usr/bin/Xorg
XauthPath = /tmp/orbit-xauth

[Sessions]
SessionDir = /usr/share/xsessions
WaylandSessionDir = /usr/share/wayland-sessions

[Users]
MinUid = 1000
MaxUid = 65000
